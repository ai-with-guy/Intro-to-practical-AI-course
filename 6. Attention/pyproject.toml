[project]
name = "attention-lesson"
version = "0.1.0"
description = "Attention experiments for the Intro to Practical AI course"
requires-python = ">=3.11,<3.14"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "transformers>=5,<6",
    "ipywidgets>=8.1.5",
]

[project.optional-dependencies]
cuda = ["torch>=2.6,<3"]
xpu = ["torch>=2.6,<3"]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"
conflicts = [[{ extra = "cuda" }, { extra = "xpu" }]]

[tool.uv.sources]
torch = [
    { index = "pypi-torch", extra = "cuda" },
    { index = "pytorch-xpu", extra = "xpu" },
]

[[tool.uv.index]]
name = "pypi-torch"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
# Also supplies torch's transitive triton-xpu dependency on Windows/Linux.
