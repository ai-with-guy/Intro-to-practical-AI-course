[project]
name = "deep-learning-fundamentals"
version = "0.1.0"
description = "PyTorch fundamentals for the Intro to Practical AI course"
requires-python = ">=3.11,<3.14"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=3.0.5",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
cuda = ["torch>=2.5,<3"]
xpu = ["torch>=2.5,<3"]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"
conflicts = [
    [
        { extra = "cuda" },
        { extra = "xpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pypi-torch", extra = "cuda" },
    { index = "pytorch-xpu", extra = "xpu" },
]

[[tool.uv.index]]
name = "pypi-torch"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
